[project]
name = "orion-hands-tracker"
version = "3.0.0"
description = "ORION hand-gesture tracker: a USB camera on a Raspberry Pi, MediaPipe gestures, served over MCP"
requires-python = ">=3.12"
# Not installed as a package: the image installs requirements.txt (exact versions, hashes) and copies the code;
# the tests need requirements-test.txt. This file configures the tools.

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ASYNC"]
# PLC0415: OpenCV and MediaPipe are imported where used, so the logic and its tests load without them.
ignore = ["PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW0603", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short --strict-markers"
asyncio_mode = "auto"
